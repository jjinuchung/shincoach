<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>신코치 - 영어 섀도잉</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== 라이브러리 화면 ===== -->
  <section id="view-library" class="view">
    <header class="topbar">
      <h1 class="topbar-title">🎬 신코치 영어</h1>
      <button id="btn-import" class="btn btn-primary">＋ 영상 가져오기</button>
    </header>

    <main class="library-main">
      <ul id="library-list" class="library-list"></ul>
      <p id="library-empty" class="library-empty">
        아직 영상이 없어요.<br>
        <b>＋ 영상 가져오기</b>를 눌러 영상(mp4)과 자막(srt/smi)을 넣어주세요.
      </p>
    </main>

    <footer class="storage-info">
      <span id="storage-text">저장 공간 확인 중...</span>
    </footer>
  </section>

  <!-- ===== 가져오기 대화상자 ===== -->
  <dialog id="dlg-import" class="dialog">
    <form id="form-import" method="dialog">
      <h2>영상 가져오기</h2>

      <label class="field">
        <span class="field-label">제목</span>
        <input type="text" id="imp-title" placeholder="예: 페파피그 1화" required>
      </label>

      <label class="field">
        <span class="field-label">영상 파일 <small>— mp4(H.264) 권장</small></span>
        <input type="file" id="imp-video" accept="video/*" required>
      </label>

      <label class="field">
        <span class="field-label">영어 자막 <small>— srt / smi</small></span>
        <input type="file" id="imp-sub-en" accept=".srt,.vtt,.smi,.sami" required>
      </label>

      <label class="field">
        <span class="field-label">한글 자막 <small>— 없으면 비워두세요. smi에 영·한이 같이 있으면 자동으로 찾아요</small></span>
        <input type="file" id="imp-sub-ko" accept=".srt,.vtt,.smi,.sami">
      </label>

      <p id="imp-status" class="imp-status"></p>

      <div class="dialog-actions">
        <button type="button" id="imp-cancel" class="btn">취소</button>
        <button type="submit" id="imp-submit" class="btn btn-primary">저장</button>
      </div>
    </form>
  </dialog>

  <!-- ===== 플레이어 화면 ===== -->
  <section id="view-player" class="view" hidden>
    <header class="topbar">
      <button id="btn-back" class="btn btn-icon" aria-label="목록으로">←</button>
      <h1 id="player-title" class="topbar-title"></h1>
      <button id="btn-settings" class="btn btn-icon" aria-label="설정">⚙</button>
    </header>

    <div class="player-body">
      <div class="player-left">
        <div class="video-wrap">
          <video id="video" playsinline preload="metadata"></video>
          <div id="player-msg" class="player-msg" hidden></div>
          <div id="shadow-overlay" class="shadow-overlay" hidden>
            <div class="shadow-msg">🗣 따라 말해보세요!</div>
            <div class="shadow-ring"><div id="shadow-ring-fill" class="shadow-ring-fill"></div></div>
          </div>
        </div>

        <div class="progress-row">
          <span id="cue-counter" class="cue-counter">0 / 0</span>
          <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
        </div>
      </div>

      <div class="player-right">
        <div class="subtitle-box">
          <p id="sub-en" class="sub-en"></p>
          <p id="sub-ko" class="sub-ko"></p>
        </div>

        <div class="controls-main">
          <button id="btn-prev" class="btn btn-big" aria-label="이전 문장">◀</button>
          <button id="btn-play" class="btn btn-big btn-play" aria-label="재생">▶</button>
          <button id="btn-next" class="btn btn-big" aria-label="다음 문장">▶</button>
        </div>

        <div class="controls-sub">
          <button id="btn-repeat" class="btn btn-chip" data-state="off">🔁 반복 <span id="repeat-label">끔</span></button>
          <button id="btn-speed" class="btn btn-chip">🐢 <span id="speed-label">1.0x</span></button>
          <button id="btn-shadow" class="btn btn-chip" data-state="off">🗣 섀도잉</button>
          <button id="btn-toggle-en" class="btn btn-chip is-on">EN</button>
          <button id="btn-toggle-ko" class="btn btn-chip is-on">KO</button>
        </div>

        <details class="script-panel" open>
          <summary>📜 전체 대사</summary>
          <ol id="script-list" class="script-list"></ol>
        </details>
      </div>
    </div>
  </section>

  <!-- ===== 새 버전 안내 ===== -->
  <div id="update-toast" class="update-toast" hidden>
    <span>새 버전이 준비됐어요</span>
    <button id="update-reload" class="btn btn-primary">새로고침</button>
  </div>

  <!-- ===== 로딩 오버레이 ===== -->
  <div id="loading" class="loading" hidden>
    <div class="loading-box">
      <div class="loading-spinner"></div>
      <div id="loading-text">불러오는 중...</div>
    </div>
  </div>

  <!-- ===== 설정 대화상자 ===== -->
  <dialog id="dlg-settings" class="dialog">
    <form id="form-settings" method="dialog">
      <h2>설정</h2>

      <label class="field field-row">
        <input type="checkbox" id="set-merge">
        <span class="field-label">문장 자동 합치기 <small>— 두 줄로 나뉜 한 문장을 하나로</small></span>
      </label>

      <label class="field">
        <span class="field-label">따라 말하기 시간</span>
        <select id="set-shadow-factor">
          <option value="1.0">짧게 (문장 길이 × 1.0)</option>
          <option value="1.5">보통 (문장 길이 × 1.5)</option>
          <option value="2.0">길게 (문장 길이 × 2.0)</option>
        </select>
      </label>

      <div class="dialog-actions">
        <button type="button" id="set-close" class="btn">취소</button>
        <button type="submit" class="btn btn-primary">저장</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
